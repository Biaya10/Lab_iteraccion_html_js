<!DOCTYPE html>

<body>

  <h1 id="primer-h1">¡Hola mundo!</h1>

  <h3 id="encabezado-naranja">Hola mundo</h3>

  <h5>Hola mundo</h5>
  <h6>Hola mundo</h6>
  <p class="azul">Este es un párrafo con clase azul.</p>
  <p class="azul">Este es otro párrafo con clase azul.</p>

  <button type="button" id="boton">Haz clic aquí</button>
  <p id="mensaje"></p>

  <script src="script.js"></script>
